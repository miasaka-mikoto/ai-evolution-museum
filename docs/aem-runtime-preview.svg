<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b0e"/><stop offset="0.55" stop-color="#10161a"/><stop offset="1" stop-color="#080b0e"/>
    </linearGradient>
    <radialGradient id="halo" cx="58%" cy="44%" r="58%">
      <stop offset="0" stop-color="#b89555" stop-opacity=".12"/><stop offset=".7" stop-color="#7b91a5" stop-opacity=".02"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#b7c5ce" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g opacity=".18" filter="url(#soft)" fill="#d8bd81"><circle cx="1050" cy="430" r="130"/><circle cx="1300" cy="250" r="75"/></g>

  <g fill="#e9eef0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="58" y="58" font-size="14" letter-spacing="4">AI EVOLUTION / MUSEUM</text>
    <text x="58" y="82" font-size="10" letter-spacing="3" fill="#8f9aa2">AEM · LIVE LOCAL RUNTIME</text>
    <circle cx="1460" cy="53" r="4" fill="#a7c28d"/><text x="1475" y="58" font-size="10" fill="#a7b2b9">OFFLINE</text>
  </g>

  <!-- deterministic tape/state visualization -->
  <g transform="translate(390 250)">
    <text x="0" y="-52" fill="#9ba8ae" font-size="11" letter-spacing="3" font-family="ui-monospace, monospace">TAPE / TRANSITION TABLE</text>
    <line x1="0" y1="18" x2="720" y2="18" stroke="#94a4ae" stroke-opacity=".32"/>
    <g font-family="ui-monospace, monospace" font-size="24" text-anchor="middle">
      <g fill="#d9e1e4" stroke="#a9b6bc" stroke-opacity=".28">
        <rect x="0" y="-24" width="74" height="84"/><rect x="74" y="-24" width="74" height="84"/>
        <rect x="148" y="-24" width="74" height="84"/><rect x="222" y="-24" width="74" height="84"/>
        <rect x="296" y="-24" width="74" height="84"/><rect x="370" y="-24" width="74" height="84"/>
        <rect x="444" y="-24" width="74" height="84"/><rect x="518" y="-24" width="74" height="84"/>
        <rect x="592" y="-24" width="74" height="84"/><rect x="666" y="-24" width="74" height="84"/>
      </g>
      <g fill="#162026"><text x="37" y="28">1</text><text x="111" y="28">0</text><text x="185" y="28">1</text><text x="259" y="28">1</text><text x="333" y="28">0</text><text x="407" y="28">1</text><text x="481" y="28">0</text><text x="555" y="28">0</text><text x="629" y="28">1</text><text x="703" y="28">0</text></g>
    </g>
    <path d="M425 -72 C425 -108 425 -108 425 -138" fill="none" stroke="#d8bd81" stroke-width="2"/>
    <path d="M413 -138 l12 -20 12 20z" fill="#d8bd81"/>
    <text x="450" y="-112" fill="#d8bd81" font-size="12" font-family="ui-monospace, monospace">HEAD · q1</text>
    <g fill="none" stroke="#b6c8d3" stroke-opacity=".45" stroke-width="1.5"><path d="M460 92 C520 145 585 145 650 92"/><path d="M460 92 C520 40 585 40 650 92"/></g>
    <circle cx="460" cy="92" r="5" fill="#d8bd81"/><circle cx="650" cy="92" r="5" fill="#d8bd81"/>
    <text x="675" y="96" fill="#9ba8ae" font-size="11" font-family="ui-monospace, monospace">write 0 · move L</text>
  </g>

  <g transform="translate(1120 160)">
    <rect width="360" height="480" fill="#090d10" fill-opacity=".88" stroke="#dfe7ea" stroke-opacity=".22"/>
    <rect x="34" y="38" width="4" height="46" fill="#d8bd81"/><rect x="44" y="50" width="4" height="34" fill="#d8bd81" opacity=".72"/><rect x="54" y="61" width="4" height="23" fill="#d8bd81" opacity=".5"/>
    <text x="34" y="128" fill="#8f9aa2" font-size="10" letter-spacing="3" font-family="ui-monospace, monospace">AEM / RESEARCH INTERFACE</text>
    <text x="34" y="176" fill="#edf1f2" font-size="38" font-family="Inter, Arial, sans-serif">AI Evolution</text>
    <text x="34" y="214" fill="#d8bd81" font-size="38" font-family="Inter, Arial, sans-serif">Museum</text>
    <text x="34" y="242" fill="#d8bd81" font-size="10" letter-spacing="2" font-family="ui-monospace, monospace">人工智能演化博物馆 · AEM</text>
    <text x="34" y="276" fill="#9ba8ae" font-size="11" font-family="ui-monospace, monospace">A live archive of machines that</text>
    <text x="34" y="294" fill="#9ba8ae" font-size="11" font-family="ui-monospace, monospace">search, learn, remember and act.</text>
    <rect x="34" y="326" width="292" height="36" fill="#fff" fill-opacity=".035" stroke="#dfe7ea" stroke-opacity=".2"/><text x="48" y="349" fill="#737e85" font-size="10" font-family="ui-monospace, monospace">researcher@example.com</text>
    <rect x="34" y="374" width="292" height="36" fill="#fff" fill-opacity=".035" stroke="#dfe7ea" stroke-opacity=".2"/><text x="48" y="397" fill="#737e85" font-size="10" font-family="ui-monospace, monospace">••••••••</text>
    <rect x="34" y="430" width="292" height="36" fill="#d8bd81"/><text x="48" y="453" fill="#111517" font-size="11" font-family="ui-monospace, monospace">SIGN IN</text><text x="300" y="453" fill="#111517" font-size="15">↗</text>
  </g>

  <g transform="translate(58 760)" font-family="ui-monospace, monospace">
    <text x="0" y="0" fill="#d8bd81" font-size="42">1936</text><text x="122" y="-4" fill="#edf1f2" font-size="16" letter-spacing="3">TURING MACHINE</text><text x="122" y="20" fill="#8f9aa2" font-size="11">A binary tape advances by a real state transition table.</text>
    <line x1="0" y1="54" x2="1484" y2="54" stroke="#dfe7ea" stroke-opacity=".18"/>
    <g fill="#9ba8ae" font-size="10"><text x="0" y="78">1936</text><text x="205" y="78">1950</text><text x="410" y="78">1970</text><text x="615" y="78">1986</text><text x="820" y="78">2006</text><text x="1025" y="78">2017</text><text x="1230" y="78">2020</text><text x="1435" y="78">2026</text></g>
    <circle cx="8" cy="54" r="4" fill="#d8bd81"/>
  </g>
</svg>
